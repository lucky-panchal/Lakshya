services:
  - type: web
    name: lakshyaai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CORS_ORIGIN
        value: https://lakshhya.netlify.app
    disk:
      name: corpus-data
      mountPath: /data
      sizeGB: 1
